name: 🧪 Build Test Branch (Artifacts)

on:
  push:
    branches-ignore:
      - main
      - gh-pages
      - 'api/**'
    paths:
      - 'shared/**'
      - 'androidApp/**'
      - 'iosApp/**'
      - 'maps/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
      - '.github/workflows/build-test-branch.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'shared/**'
      - 'androidApp/**'
      - 'iosApp/**'
      - 'maps/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
      - '.github/workflows/build-test-branch.yml'
  workflow_dispatch:
    inputs:
      build_apk:
        description: 'Build Android APK'
        required: true
        type: boolean
        default: true
      build_ipa:
        description: 'Build iOS IPA'
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build_apk:
    name: 🤖 Test Build Android APK
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || inputs.build_apk
    steps:
      - name: 📚 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 21

      - name: 🔑 Make gradlew executable
        run: chmod +x gradlew

      - name: ♻️ Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: 🔨 Build Android APK
        run: ./gradlew assembleDebug --stacktrace

      - name: 🏷️ Prepare APK Artifact
        run: |
          mkdir -p dist
          cp androidApp/build/outputs/apk/debug/*.apk dist/Schedule-MIREA.apk

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Schedule-MIREA-APK
          path: dist/Schedule-MIREA.apk
          if-no-files-found: error

  build_ipa:
    name: 🍏 Test Build iOS Unsigned IPA
    runs-on: macos-15
    if: github.event_name != 'workflow_dispatch' || inputs.build_ipa
    steps:
      - name: 📚 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 21

      - name: 🔑 Make gradlew executable
        run: chmod +x gradlew

      - name: 📦 Cache Kotlin/Native toolchain (~/.konan)
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            konan-${{ runner.os }}-

      - name: ♻️ Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false
        env:
          ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

      - name: 🛠️ Set Xcode Version
        run: |
          if [ -d "/Applications/Xcode_16.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          fi
          xcodebuild -version

      - name: 🔨 Build iOS App (no codesign)
        run: |
          cd iosApp
          xcodebuild -scheme iosApp \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            DEBUG_INFORMATION_FORMAT=dwarf \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build

      - name: 📦 Package Unsigned IPA
        run: |
          cd iosApp
          mkdir -p Payload
          APP_PATH=$(find build -name "*.app" -type d | head -n 1)
          echo "Found app at: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          zip -r ../Schedule-MIREA.ipa Payload
          rm -rf Payload
          cd ..

      - name: 📤 Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Schedule-MIREA-IPA
          path: Schedule-MIREA.ipa
          if-no-files-found: error

  test_summary:
    name: 📋 Test Build Summary
    runs-on: ubuntu-latest
    needs: [build_apk, build_ipa]
    if: always() && (needs.build_apk.result == 'success' || needs.build_ipa.result == 'success')
    steps:
      - name: 📝 Post Step Summary
        run: |
          BRANCH_NAME="${{ github.head_ref || github.ref_name }}"
          echo "### 🧪 Тестовая сборка для ветки \`$BRANCH_NAME\` готова!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Эта тестовая сборка предназначена для проверки работы на физическом устройстве." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Статус Android APK:** ${{ needs.build_apk.result == 'success' && '✅ Собран' || '⏭️ Пропущен/Ошибка' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Статус iOS IPA:** ${{ needs.build_ipa.result == 'success' && '✅ Собран' || '⏭️ Пропущен/Ошибка' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> 💡 **Где скачать:** Файлы установки находятся в секции **Artifacts** в самом низу страницы этого запуска (\`Schedule-MIREA-APK\` и \`Schedule-MIREA-IPA\`)." >> $GITHUB_STEP_SUMMARY
          echo "> ⚠️ Релизы и номер сборки не изменялись — официальный релиз произойдёт при слиянии в \`main\`." >> $GITHUB_STEP_SUMMARY\n