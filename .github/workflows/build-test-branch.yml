name: 🧪 Contributor Test Build (APK & IPA)

# Сборка любой ветки/SHA руками: только Actions Artifacts.
# НЕ трогает релизы, теги и gh-pages. Версия {RELEASE_VERSION}-contrib.N,
# числовой код — epoch-секунды github.run_started_at (свежая contrib-сборка
# всегда ставится поверх старой, а следующий стабильный релиз — поверх contrib).

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Ветка для сборки (пусто — текущая ветка из меню)'
        required: false
        default: ''
        type: string
      build_apk:
        description: 'Build Android APK'
        required: true
        type: boolean
        default: true
      build_ipa:
        description: 'Build iOS IPA'
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  resolve:
    name: 🧭 Resolve Build Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      build_id: ${{ steps.ver.outputs.build_id }}
      commit_sha: ${{ steps.ver.outputs.commit_sha }}
    steps:
      - name: 📚 Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch != '' && inputs.branch || github.ref }}

      # ЕДИНСТВЕННОЕ место вычисления номера сборки: один запуск = одно число
      - name: 🧭 Resolve version
        id: ver
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: python tools/versioning.py resolve --channel contrib --run-number "$RUN_NUMBER"

  build_apk:
    name: 🤖 Test Build Android APK
    runs-on: ubuntu-latest
    needs: resolve
    if: inputs.build_apk
    outputs:
      artifact_slug: ${{ steps.slug.outputs.artifact_slug }}
    steps:
      - name: 📚 Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch != '' && inputs.branch || github.ref }}

      - name: 🔖 Patch version files (contrib)
        run: python tools/versioning.py prepare --channel contrib --run-number "${{ github.run_number }}" --build-id "${{ needs.resolve.outputs.build_id }}"

      - name: 🏷️ Compute artifact slug
        id: slug
        env:
          BRANCH: ${{ inputs.branch != '' && inputs.branch || github.ref_name }}
        run: |
          SLUG=$(python3 -c "import re,sys; print(re.sub(r'[^a-zA-Z0-9._-]','-',sys.argv[1])[:32].strip('-'))" "$BRANCH")
          echo "artifact_slug=test-${SLUG}-${{ needs.resolve.outputs.commit_sha }}-r${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: 🔢 Export build number (versionCode == AppVersion.BUILD_NUMBER)
        run: echo "BUILD_NUMBER=${{ needs.resolve.outputs.build_id }}" >> $GITHUB_ENV

      - name: ☕ Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 21

      - name: 🔑 Make gradlew executable
        run: chmod +x gradlew

      - name: ♻️ Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false
        env:
          ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

      - name: 🔨 Run all tests + Build Android APK
        run: ./gradlew :shared:allTests assembleDebug --stacktrace

      - name: 🏷️ Prepare APK Artifact
        run: |
          mkdir -p dist
          cp androidApp/build/outputs/apk/debug/*.apk "dist/Schedule-${{ steps.slug.outputs.artifact_slug }}.apk"

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Schedule-${{ steps.slug.outputs.artifact_slug }}-APK
          path: dist/Schedule-${{ steps.slug.outputs.artifact_slug }}.apk
          if-no-files-found: error

  build_ipa:
    name: 🍏 Test Build iOS Unsigned IPA
    runs-on: macos-15
    needs: resolve
    if: inputs.build_ipa
    outputs:
      artifact_slug: ${{ steps.slug.outputs.artifact_slug }}
    steps:
      - name: 📚 Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch != '' && inputs.branch || github.ref }}

      - name: 🔖 Patch version files (contrib)
        run: python tools/versioning.py prepare --channel contrib --run-number "${{ github.run_number }}" --build-id "${{ needs.resolve.outputs.build_id }}"

      - name: 🏷️ Compute artifact slug
        id: slug
        env:
          BRANCH: ${{ inputs.branch != '' && inputs.branch || github.ref_name }}
        run: |
          SLUG=$(python3 -c "import re,sys; print(re.sub(r'[^a-zA-Z0-9._-]','-',sys.argv[1])[:32].strip('-'))" "$BRANCH")
          echo "artifact_slug=test-${SLUG}-${{ needs.resolve.outputs.commit_sha }}-r${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: ☕ Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 21

      - name: 🔑 Make gradlew executable
        run: chmod +x gradlew

      - name: 📦 Cache Kotlin/Native toolchain (~/.konan)
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            konan-${{ runner.os }}-

      - name: ♻️ Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false
        env:
          ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

      - name: 🛠️ Set Xcode Version
        run: |
          if [ -d "/Applications/Xcode_16.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          fi
          xcodebuild -version

      - name: 🔨 Build iOS App (no codesign)
        run: |
          cd iosApp
          xcodebuild -scheme iosApp \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            DEBUG_INFORMATION_FORMAT=dwarf \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build

      - name: 📦 Package Unsigned IPA
        run: |
          cd iosApp
          mkdir -p Payload
          APP_PATH=$(find build -name "*.app" -type d | head -n 1)
          echo "Found app at: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          IPA_NAME="Schedule-${{ steps.slug.outputs.artifact_slug }}.ipa"
          zip -r "../$IPA_NAME" Payload
          rm -rf Payload
          cd ..
          echo "IPA_NAME=$IPA_NAME" >> $GITHUB_ENV

      - name: 📤 Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Schedule-${{ steps.slug.outputs.artifact_slug }}-IPA
          path: ${{ env.IPA_NAME }}
          if-no-files-found: error

  test_summary:
    name: 📋 Test Build Summary
    runs-on: ubuntu-latest
    needs: [resolve, build_apk, build_ipa]
    if: always() && (needs.build_apk.result == 'success' || needs.build_ipa.result == 'success')
    steps:
      - name: 📝 Post Step Summary
        env:
          BRANCH_NAME: ${{ inputs.branch != '' && inputs.branch || github.ref_name }}
          SLUG: ${{ needs.build_apk.outputs.artifact_slug || needs.build_ipa.outputs.artifact_slug || 'test' }}
          VERSION: ${{ needs.resolve.outputs.version }}
          COMMIT: ${{ needs.resolve.outputs.commit_sha }}
          BUILD_ID: ${{ needs.resolve.outputs.build_id }}
          APK_STATUS: ${{ needs.build_apk.result }}
          IPA_STATUS: ${{ needs.build_ipa.result }}
        run: |
          python3 - << 'EOF'
          import os

          branch = os.environ.get("BRANCH_NAME", "")
          slug = os.environ.get("SLUG", "test")
          version = os.environ.get("VERSION", "")
          commit = os.environ.get("COMMIT", "HEAD")
          build_id = os.environ.get("BUILD_ID", "")
          apk_status = os.environ.get("APK_STATUS", "")
          ipa_status = os.environ.get("IPA_STATUS", "")

          apk_badge = "✅ Готов" if apk_status == "success" else ("⏭️ Пропущен" if apk_status == "skipped" else "❌ Ошибка")
          ipa_badge = "✅ Готов" if ipa_status == "success" else ("⏭️ Пропущен" if ipa_status == "skipped" else "❌ Ошибка")

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if not summary_path:
              raise SystemExit(0)

          with open(summary_path, "a", encoding="utf-8") as f:
              f.write("### 🧪 Тестовая сборка готова!\n\n")
              f.write("| Параметр | Значение |\n")
              f.write("| :--- | :--- |\n")
              f.write(f"| 🌿 **Ветка** | `{branch}` |\n")
              f.write(f"| 🏷️ **Версия** | `{version}` |\n")
              f.write(f"| 📌 **Коммит** | `{commit}` |\n")
              f.write(f"| 🔢 **Числовой код** | `{build_id}` |\n")
              f.write(f"| 🤖 **Android APK** | {apk_badge} |\n")
              f.write(f"| 🍏 **iOS Unsigned IPA** | {ipa_badge} |\n\n")
              f.write("#### 📦 Артефакты сборки:\n")
              if apk_status == "success":
                  f.write(f"- 🤖 **Android APK:** `Schedule-{slug}-APK` (`Schedule-{slug}.apk`)\n")
              if ipa_status == "success":
                  f.write(f"- 🍏 **iOS IPA:** `Schedule-{slug}-IPA` (`Schedule-{slug}.ipa`)\n")
              f.write("\n")
              f.write("> 💡 **Где скачать:** блок **Artifacts** внизу страницы запуска.\n")
              f.write("> 🛡️ **Изоляция:** релизы, теги и gh-pages не затронуты.\n")
          EOF
