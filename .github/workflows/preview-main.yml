name: 🚧 Main Preview Build (Rolling)

# Тестовые сборки main. Каждый push в main (только код приложения) собирает
# версию {RELEASE_VERSION}-dev.N и заменяет файлы в ОДНОМ rolling-prerelease
# `preview`. GitHub Releases не плодятся, version.json НЕ обновляется —
# обычные пользователи этих сборок не видят. Dev-сборки видны только через
# GBox-источник apps-beta.json (приложение их больше не проверяет).

on:
  push:
    branches:
      - main
    paths:
      - 'shared/**'
      - 'androidApp/**'
      - 'iosApp/**'
      - 'maps/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: preview-main
  cancel-in-progress: true

jobs:
  resolve:
    name: 🧭 Resolve Build Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      build_id: ${{ steps.ver.outputs.build_id }}
      commit_sha: ${{ steps.ver.outputs.commit_sha }}
      prev_version: ${{ steps.ver.outputs.prev_version }}
    steps:
      - name: 📚 Checkout Repository
        uses: actions/checkout@v4

      # ЕДИНСТВЕННОЕ место вычисления номера сборки: один запуск = одно число
      # для APK, IPA, релиза и apps-beta.json (github.run_started_at в
      # выражениях рендерится пустым — не полагаться на него).
      # Номер дев-сборки = прошлый номер той же линии +1 (имя релиза preview),
      # отменившиеся прогоны номер не съедают; смена RELEASE_VERSION → dev.1.
      - name: 🧭 Resolve version
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PREV="$(gh api "repos/${{ github.repository }}/releases/tags/preview" --jq .name 2>/dev/null || true)"
          python tools/versioning.py resolve --channel dev --prev-version "${PREV:-}"

  build_apk:
    name: 🤖 Build Android APK (dev)
    runs-on: ubuntu-latest
    needs: resolve
    steps:
      - name: 📚 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔖 Patch version files (dev)
        run: python tools/versioning.py prepare --channel dev --prev-version "${{ needs.resolve.outputs.prev_version }}" --build-id "${{ needs.resolve.outputs.build_id }}"

      - name: 🔢 Export build number (versionCode == AppVersion.BUILD_NUMBER)
        run: echo "BUILD_NUMBER=${{ needs.resolve.outputs.build_id }}" >> $GITHUB_ENV

      - name: ☕ Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 21

      - name: 🔑 Make gradlew executable
        run: chmod +x gradlew

      - name: ♻️ Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: 🔨 Run all tests + Build Android APK
        run: ./gradlew :shared:allTests :androidApp:assembleDebug --stacktrace

      - name: 🏷️ Prepare preview APK
        run: |
          mkdir -p dist
          cp androidApp/build/outputs/apk/debug/*.apk dist/MIREA-Schedule-preview.apk

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MIREA-Schedule-preview-APK
          path: dist/MIREA-Schedule-preview.apk
          if-no-files-found: error

  build_ipa:
    name: 🍏 Build iOS Unsigned IPA (dev)
    runs-on: macos-15
    needs: resolve
    steps:
      - name: 📚 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔖 Patch version files (dev)
        run: python tools/versioning.py prepare --channel dev --prev-version "${{ needs.resolve.outputs.prev_version }}" --build-id "${{ needs.resolve.outputs.build_id }}"

      - name: ☕ Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 21

      - name: 🔑 Make gradlew executable
        run: chmod +x gradlew

      - name: 📦 Cache Kotlin/Native toolchain (~/.konan)
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            konan-${{ runner.os }}-

      - name: ♻️ Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false
        env:
          ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

      - name: 🛠️ Set Xcode Version
        run: |
          if [ -d "/Applications/Xcode_16.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          fi
          xcodebuild -version

      - name: 🔨 Build iOS App (no codesign)
        run: |
          cd iosApp
          xcodebuild -scheme iosApp \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            DEBUG_INFORMATION_FORMAT=dwarf \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build

      - name: 📦 Package Unsigned IPA
        run: |
          cd iosApp
          mkdir -p Payload
          APP_PATH=$(find build -name "*.app" -type d | head -n 1)
          echo "Found app at: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          zip -r ../MIREA-Schedule-preview.ipa Payload
          rm -rf Payload
          cd ..

      - name: 📤 Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MIREA-Schedule-preview-IPA
          path: MIREA-Schedule-preview.ipa
          if-no-files-found: error

  publish_preview:
    name: 🚀 Publish Rolling Preview Release
    runs-on: ubuntu-latest
    needs: [resolve, build_apk, build_ipa]
    if: always() && (needs.build_apk.result == 'success' || needs.build_ipa.result == 'success')
    steps:
      - name: 📚 Checkout Repository
        uses: actions/checkout@v4

      - name: 📥 Download APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: MIREA-Schedule-preview-APK
          path: download_apk
        continue-on-error: true

      - name: 📥 Download IPA Artifact
        uses: actions/download-artifact@v4
        with:
          name: MIREA-Schedule-preview-IPA
          path: download_ipa
        continue-on-error: true

      - name: 🐍 Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 🚀 Publish rolling preview release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.resolve.outputs.version }}
          BUILD: ${{ needs.resolve.outputs.build_id }}
          SHA: ${{ needs.resolve.outputs.commit_sha }}
        run: |
          APK=$(find download_apk -name '*.apk' 2>/dev/null | head -n 1)
          IPA=$(find download_ipa -name '*.ipa' 2>/dev/null | head -n 1)
          ARGS=""
          [ -n "$APK" ] && ARGS="$ARGS --apk $APK"
          [ -n "$IPA" ] && ARGS="$ARGS --ipa $IPA"
          python tools/publish_release.py --channel preview --version "$VERSION" --build-number "$BUILD" --commit-sha "$SHA" $ARGS

  update_preview_feed:
    name: 📡 Update GBox Beta Source (rolling)
    runs-on: ubuntu-latest
    needs: [resolve, publish_preview]
    if: needs.publish_preview.result == 'success'
    steps:
      - name: 📚 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 📝 Generate apps-beta.json (rolling GBox source)
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          BUILD: ${{ needs.resolve.outputs.build_id }}
          SHA: ${{ needs.resolve.outputs.commit_sha }}
        run: python tools/update_version_feed.py --channel preview --version "$VERSION" --build-number "$BUILD" --commit-sha "$SHA" --out-dir dist_version

      - name: 🚀 Deploy feeds to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist_version
          publish_branch: gh-pages
          keep_files: true
