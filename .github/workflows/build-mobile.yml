name: Build Mobile (APK & Unsigned IPA)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_apk:
        description: 'Build Android APK'
        required: true
        type: boolean
        default: true
      build_ipa:
        description: 'Build iOS IPA'
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build_apk:
    name: 🤖 Build Android APK
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || inputs.build_apk
    steps:
      - name: 📚 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 21

      - name: 🔑 Make gradlew executable
        run: chmod +x gradlew

      - name: ♻️ Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 🔨 Build Android APK
        run: ./gradlew assembleDebug --stacktrace

      - name: 🏷️ Prepare APK Artifact
        run: |
          mkdir -p dist
          cp androidApp/build/outputs/apk/debug/*.apk dist/Schedule-MIREA.apk

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Schedule-MIREA-APK
          path: dist/Schedule-MIREA.apk
          if-no-files-found: error

  build_ipa:
    name: 🍏 Build iOS Unsigned IPA
    runs-on: macos-15
    if: github.event_name != 'workflow_dispatch' || inputs.build_ipa
    steps:
      - name: 📚 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 21

      - name: 🔑 Make gradlew executable
        run: chmod +x gradlew

      - name: 📦 Cache Kotlin/Native toolchain (~/.konan)
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            konan-${{ runner.os }}-

      - name: ♻️ Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 🛠️ Set Xcode Version
        run: |
          if [ -d "/Applications/Xcode_16.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          fi
          xcodebuild -version

      - name: 🔨 Build iOS App (no codesign)
        run: |
          cd iosApp
          xcodebuild -scheme iosApp \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            DEBUG_INFORMATION_FORMAT=dwarf \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build

      - name: 📦 Package Unsigned IPA
        run: |
          cd iosApp
          mkdir -p Payload
          APP_PATH=$(find build -name "*.app" -type d | head -n 1)
          echo "Found app at: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          zip -r ../Schedule-MIREA.ipa Payload
          rm -rf Payload
          cd ..

      - name: 📤 Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Schedule-MIREA-IPA
          path: Schedule-MIREA.ipa
          if-no-files-found: error
