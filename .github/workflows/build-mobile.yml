name: Build Mobile (APK & Unsigned IPA)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_apk:
        description: 'Build Android APK'
        required: true
        type: boolean
        default: true
      build_ipa:
        description: 'Build iOS IPA'
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build_apk:
    name: 🤖 Build Android APK
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || inputs.build_apk
    steps:
      - name: 📚 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔢 Sync Build Number with GitHub Actions Run
        env:
          BUILD_NUM: ${{ github.run_number }}
        run: |
          python3 -c "
          import re, os
          num = os.environ.get('BUILD_NUM', '30')
          p1 = 'shared/src/commonMain/kotlin/com/jetbrains/kmpapp/data/model/AppVersion.kt'
          with open(p1, 'r', encoding='utf-8') as f: c = f.read()
          c = re.sub(r'const val BUILD_NUMBER = \d+', f'const val BUILD_NUMBER = {num}', c)
          with open(p1, 'w', encoding='utf-8') as f: f.write(c)

          p2 = 'androidApp/build.gradle.kts'
          with open(p2, 'r', encoding='utf-8') as f: c = f.read()
          c = re.sub(r'versionCode = .*?\n', f'versionCode = {num}\n', c)
          with open(p2, 'w', encoding='utf-8') as f: f.write(c)

          p3 = 'iosApp/iosApp/Info.plist'
          with open(p3, 'r', encoding='utf-8') as f: c = f.read()
          c = re.sub(r'(<key>CFBundleVersion</key>\s*<string>)\d+(</string>)', rf'\g<1>{num}\g<2>', c)
          with open(p3, 'w', encoding='utf-8') as f: f.write(c)
          "

      - name: ☕ Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 21

      - name: 🔑 Make gradlew executable
        run: chmod +x gradlew

      - name: ♻️ Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: 🔨 Build Android APK
        run: ./gradlew assembleDebug --stacktrace

      - name: 🏷️ Prepare APK Artifact
        run: |
          mkdir -p dist
          cp androidApp/build/outputs/apk/debug/*.apk dist/Schedule-MIREA.apk

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Schedule-MIREA-APK
          path: dist/Schedule-MIREA.apk
          if-no-files-found: error

  build_ipa:
    name: 🍏 Build iOS Unsigned IPA
    runs-on: macos-15
    if: github.event_name != 'workflow_dispatch' || inputs.build_ipa
    steps:
      - name: 📚 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔢 Sync Build Number with GitHub Actions Run
        env:
          BUILD_NUM: ${{ github.run_number }}
        run: |
          python3 -c "
          import re, os
          num = os.environ.get('BUILD_NUM', '30')
          p1 = 'shared/src/commonMain/kotlin/com/jetbrains/kmpapp/data/model/AppVersion.kt'
          with open(p1, 'r', encoding='utf-8') as f: c = f.read()
          c = re.sub(r'const val BUILD_NUMBER = \d+', f'const val BUILD_NUMBER = {num}', c)
          with open(p1, 'w', encoding='utf-8') as f: f.write(c)

          p2 = 'androidApp/build.gradle.kts'
          with open(p2, 'r', encoding='utf-8') as f: c = f.read()
          c = re.sub(r'versionCode = .*?\n', f'versionCode = {num}\n', c)
          with open(p2, 'w', encoding='utf-8') as f: f.write(c)

          p3 = 'iosApp/iosApp/Info.plist'
          with open(p3, 'r', encoding='utf-8') as f: c = f.read()
          c = re.sub(r'(<key>CFBundleVersion</key>\s*<string>)\d+(</string>)', rf'\g<1>{num}\g<2>', c)
          with open(p3, 'w', encoding='utf-8') as f: f.write(c)
          "

      - name: ☕ Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 21

      - name: 🔑 Make gradlew executable
        run: chmod +x gradlew

      - name: 📦 Cache Kotlin/Native toolchain (~/.konan)
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            konan-${{ runner.os }}-

      - name: ♻️ Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false
        env:
          ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

      - name: 🛠️ Set Xcode Version
        run: |
          if [ -d "/Applications/Xcode_16.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          fi
          xcodebuild -version

      - name: 🔨 Build iOS App (no codesign)
        run: |
          cd iosApp
          xcodebuild -scheme iosApp \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            DEBUG_INFORMATION_FORMAT=dwarf \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build

      - name: 📦 Package Unsigned IPA
        run: |
          cd iosApp
          mkdir -p Payload
          APP_PATH=$(find build -name "*.app" -type d | head -n 1)
          echo "Found app at: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          zip -r ../Schedule-MIREA.ipa Payload
          rm -rf Payload
          cd ..

      - name: 📤 Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Schedule-MIREA-IPA
          path: Schedule-MIREA.ipa
          if-no-files-found: error

  update_version_feed:
    name: 📡 Update Version Feed (gh-pages)
    runs-on: ubuntu-latest
    needs: [build_apk, build_ipa]
    if: always() && (needs.build_apk.result == 'success' || needs.build_ipa.result == 'success') && github.ref == 'refs/heads/main'
    steps:
      - name: 📚 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 📝 Generate version.json
        env:
          BUILD_NUM: ${{ github.run_number }}
        run: |
          python tools/update_version_feed.py --build-number ${{ github.run_number }} --out-dir dist_version

      - name: 🚀 Deploy version.json to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist_version
          publish_branch: gh-pages
          keep_files: true
