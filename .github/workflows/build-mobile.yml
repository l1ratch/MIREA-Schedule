name: 🚀 Release Mobile (Tag v*)

# Релизный сборщик. Запускается ТОЛЬКО пушем тега v26.10 / v26.10.1 /
# v26.10-beta.1 / v26.10-rc.1 или вручную (dispatch с указанием тега).
# Канал выводится из тега: чистый тег → stable (+ version.json + apps.json),
# beta/rc → иммутабельный prerelease. Push в main сюда НЕ попадает —
# тестовые сборки main собирает preview-main.yml.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Тег релиза, например v26.10 или v26.10-beta.1'
        required: true
        type: string

permissions:
  contents: write

jobs:
  resolve:
    name: 🧭 Resolve Release Channel
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      channel: ${{ steps.ver.outputs.channel }}
      prerelease: ${{ steps.ver.outputs.prerelease }}
      build_id: ${{ steps.ver.outputs.build_id }}
      commit_sha: ${{ steps.ver.outputs.commit_sha }}
    steps:
      - name: 📚 Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag != '' && inputs.tag || github.ref }}

      - name: 🧭 Validate tag & resolve version
        id: ver
        env:
          TAG: ${{ inputs.tag != '' && inputs.tag || github.ref_name }}
          RUN_STARTED: ${{ github.run_started_at }}
        run: python tools/versioning.py resolve --tag "$TAG" --build-time "$RUN_STARTED"

  build_apk:
    name: 🤖 Build Android APK
    runs-on: ubuntu-latest
    needs: resolve
    steps:
      - name: 📚 Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag != '' && inputs.tag || github.ref }}

      - name: 🔖 Patch version files
        env:
          TAG: ${{ inputs.tag != '' && inputs.tag || github.ref_name }}
          RUN_STARTED: ${{ github.run_started_at }}
        run: python tools/versioning.py prepare --tag "$TAG" --build-time "$RUN_STARTED"

      - name: 🔢 Export build number (versionCode == AppVersion.BUILD_NUMBER)
        run: echo "BUILD_NUMBER=${{ needs.resolve.outputs.build_id }}" >> $GITHUB_ENV

      - name: ☕ Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 21

      - name: 🔑 Make gradlew executable
        run: chmod +x gradlew

      - name: ♻️ Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: 🔨 Run all tests + Build Android APK
        run: ./gradlew :shared:allTests assembleDebug --stacktrace

      - name: 🏷️ Prepare APK Artifact
        env:
          CHANNEL: ${{ needs.resolve.outputs.channel }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          mkdir -p dist
          if [ "$CHANNEL" = "stable" ]; then
            # неизменное имя — на него ссылаются старые версии приложения
            cp androidApp/build/outputs/apk/debug/*.apk dist/Schedule-MIREA.apk
          else
            cp androidApp/build/outputs/apk/debug/*.apk "dist/Schedule-MIREA-v${VERSION}.apk"
          fi

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Schedule-MIREA-APK
          path: dist/*.apk
          if-no-files-found: error

  build_ipa:
    name: 🍏 Build iOS Unsigned IPA
    runs-on: macos-15
    needs: resolve
    steps:
      - name: 📚 Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag != '' && inputs.tag || github.ref }}

      - name: 🔖 Patch version files
        env:
          TAG: ${{ inputs.tag != '' && inputs.tag || github.ref_name }}
          RUN_STARTED: ${{ github.run_started_at }}
        run: python tools/versioning.py prepare --tag "$TAG" --build-time "$RUN_STARTED"

      - name: ☕ Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 21

      - name: 🔑 Make gradlew executable
        run: chmod +x gradlew

      - name: 📦 Cache Kotlin/Native toolchain (~/.konan)
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            konan-${{ runner.os }}-

      - name: ♻️ Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false
        env:
          ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

      - name: 🛠️ Set Xcode Version
        run: |
          if [ -d "/Applications/Xcode_16.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          fi
          xcodebuild -version

      - name: 🔨 Build iOS App (no codesign)
        run: |
          cd iosApp
          xcodebuild -scheme iosApp \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            DEBUG_INFORMATION_FORMAT=dwarf \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build

      - name: 📦 Package Unsigned IPA
        env:
          CHANNEL: ${{ needs.resolve.outputs.channel }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          cd iosApp
          mkdir -p Payload
          APP_PATH=$(find build -name "*.app" -type d | head -n 1)
          echo "Found app at: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          if [ "$CHANNEL" = "stable" ]; then
            IPA_NAME="Schedule-MIREA.ipa"
          else
            IPA_NAME="Schedule-MIREA-v${VERSION}.ipa"
          fi
          zip -r "../$IPA_NAME" Payload
          rm -rf Payload
          cd ..
          echo "IPA_NAME=$IPA_NAME" >> $GITHUB_ENV

      - name: 📤 Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Schedule-MIREA-IPA
          path: ${{ env.IPA_NAME }}
          if-no-files-found: error

  publish_release:
    name: 🚀 Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [resolve, build_apk, build_ipa]
    if: always() && (needs.build_apk.result == 'success' || needs.build_ipa.result == 'success')
    steps:
      - name: 📚 Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag != '' && inputs.tag || github.ref }}

      - name: 📥 Download APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: Schedule-MIREA-APK
          path: download_apk
        continue-on-error: true

      - name: 📥 Download IPA Artifact
        uses: actions/download-artifact@v4
        with:
          name: Schedule-MIREA-IPA
          path: download_ipa
        continue-on-error: true

      - name: 🐍 Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 🚀 Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANNEL: ${{ needs.resolve.outputs.channel }}
          VERSION: ${{ needs.resolve.outputs.version }}
          BUILD: ${{ needs.resolve.outputs.build_id }}
          SHA: ${{ needs.resolve.outputs.commit_sha }}
        run: |
          APK=$(find download_apk -name '*.apk' 2>/dev/null | head -n 1)
          IPA=$(find download_ipa -name '*.ipa' 2>/dev/null | head -n 1)
          ARGS=""
          [ -n "$APK" ] && ARGS="$ARGS --apk $APK"
          [ -n "$IPA" ] && ARGS="$ARGS --ipa $IPA"
          python tools/publish_release.py --channel "$CHANNEL" --version "$VERSION" --build-number "$BUILD" --commit-sha "$SHA" $ARGS

  update_version_feed:
    name: 📡 Update Version Feed & App Source (stable only)
    runs-on: ubuntu-latest
    needs: [resolve, publish_release]
    if: needs.resolve.outputs.channel == 'stable' && needs.publish_release.result == 'success'
    steps:
      - name: 📚 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 📝 Generate version.json + apps.json
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          BUILD: ${{ needs.resolve.outputs.build_id }}
        run: python tools/update_version_feed.py --channel stable --version "$VERSION" --build-number "$BUILD" --out-dir dist_version

      - name: 🚀 Deploy feeds to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist_version
          publish_branch: gh-pages
          keep_files: true
