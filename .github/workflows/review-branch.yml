name: 🔍 Review Branch vs Main

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Ветка для анализа (оставьте пустым, если уже выбрали её выше в меню "Use workflow from")'
        required: false
        default: ''
        type: string
      base:
        description: 'Базовая ветка для сравнения'
        required: false
        default: 'main'
        type: string
      post_comment:
        description: 'Оставить отчёт комментарием в открытый Pull Request (если есть)'
        required: false
        default: true
        type: boolean
  pull_request:
    types: [opened, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    name: 🧐 Анализ изменений и архитектурный аудит
    runs-on: ubuntu-latest
    steps:
      - name: 📚 Checkout Repository (Full History)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 🔍 Run Branch AI Reviewer
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TARGET_BRANCH="${{ inputs.branch }}"
          if [ -z "$TARGET_BRANCH" ]; then
            TARGET_BRANCH="${{ github.head_ref || github.ref_name }}"
          fi
          
          BASE_BRANCH="${{ inputs.base || github.base_ref || 'main' }}"
          POST_COMMENT="${{ inputs.post_comment != 'false' }}"
          
          echo "Target Branch: $TARGET_BRANCH"
          echo "Base Branch: $BASE_BRANCH"
          
          if [ "$TARGET_BRANCH" = "$BASE_BRANCH" ]; then
            echo "⚠️ Выбрана ветка $TARGET_BRANCH, которая совпадает с базовой веткой $BASE_BRANCH."
            echo "Для анализа выберите ветку контрибьютора в верхнем меню 'Use workflow from' либо введите её имя в поле ввода."
          fi
          
          git fetch origin "$TARGET_BRANCH":"$TARGET_BRANCH" || true
          git fetch origin "$BASE_BRANCH":"$BASE_BRANCH" || true
          
          COMMENT_FLAG=""
          if [ "$POST_COMMENT" = "true" ] || [ "${{ github.event_name }}" = "pull_request" ]; then
            COMMENT_FLAG="--post-comment"
          fi
          
          PR_FLAG=""
          if [ -n "${{ github.event.pull_request.number }}" ]; then
            PR_FLAG="--pr-number ${{ github.event.pull_request.number }}"
          fi
          
          python tools/branch_reviewer.py \
            --branch "$TARGET_BRANCH" \
            --base "$BASE_BRANCH" \
            --step-summary \
            --output "branch_review_report.md" \
            $COMMENT_FLAG \
            $PR_FLAG

      - name: 📤 Upload Review Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: branch-review-report
          path: branch_review_report.md
          if-no-files-found: ignore\n